<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevPluse</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="brand-logo">
        <nav class="nav-menu">
          <a href="#features" class="nav-link"> Features</a>
          <a href="#Pricing" class="nav-link"> Pricing</a>
          <a href="#Calculator" class="nav-link"> Calculator</a>
        </nav>
        <a href="#register" class="btn btn-primary"> Deploy Free Cluster </a>
      </div>
    </header>
    <main>
      <section id="hero" class="hero-section">
        <span class="badge">
          <h1>DevPluse Core Values</h1>
          <p class="lead-text">hi</p>
          <div class="cat-group">
            <a class="btn btn-primary"></a>
            <a class="btn btn-secondary"></a>
          </div>
        </span>
      </section>
      <section id="features" class="features-section">
        <h2>This is the features section</h2>
        <div class="features-grid">
          <article class="features-card">Latency Tracking</article>
          <article class="features-card">Log Aggregation</article>
          <article class="features-card">Auto-Remediation</article>
        </div>
      </section>
      <section id="pricing" class="pricing-section">
        <h2>this is the pricing section</h2>
        <div class="features-grid">
          <h2>This is the features section</h2>
          <article class="pricing-grid">Developer</article>
          <article class="pricing-grid">Pro Cluster</article>
          <article class="pricing-grid">Enterprise Dedicated</article>
        </div>
      </section>
      <section id="pre-registration" class="pre-registration-section">
        <fieldset>
            <legend for="email" + <input type="email" required id="email"></legend>
            <legend for="volume" + <input type="number" min="1000" max="100000" step="1000"></legend>
            <legend for="sompany-tier" + <selected id="company-tier"></legend>
            <button type="submit" class="btn btn-primary btn-block"></button>
        </fieldset>
      </section>
    </main>
    <footer class="site-footer">
        <p>DevPlus footer</p>
        <ul class="footer-links">
    </footer>
  </body>
</html>
